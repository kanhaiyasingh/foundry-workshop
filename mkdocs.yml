site_name: "Microsoft Foundry: End-to-End Workshop"
site_description: >-
  Hands-on Microsoft Foundry labs with both Python notebooks and C#/.NET projects.
site_url: "https://kanhaiyasingh.github.io/foundry-workshop/"

repo_name: "kanhaiyasingh/foundry-workshop"
repo_url: "https://github.com/kanhaiyasingh/foundry-workshop"
edit_uri: "edit/main/docs/"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true
      include: ["*.ipynb"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup:
      - Python notebooks: setup.md
      - C#/.NET projects: csharp-setup.md
  - Concepts:
      - Python concepts: concepts.md
      - C#/.NET concepts: csharp-concepts.md
  - Troubleshooting: troubleshooting.md
  - Platform:
      - "What is Foundry": platform/01-what-is-foundry.md
      - "Architecture & projects": platform/02-architecture-and-projects.md
      - "Control plane & governance": platform/03-control-plane-and-governance.md
      - "MCP tool servers": platform/04-mcp-tool-servers.md
  - Python labs:
      - "Python track overview": python-reference.md
      - "Python debug log": modules/debug.md
      - "M1 · First Inference": modules/01-first-inference.ipynb
      - "M2 · Your First Agent": modules/02-your-first-agent.ipynb
      - "M3 · Tools & Function Calling": modules/03-tools-and-function-calling.ipynb
      - "M4 · Grounding / RAG (Foundry IQ)": modules/04-grounding-rag-foundry-iq.ipynb
      - "M5 · MCP Tools": modules/05-mcp-tools.ipynb
