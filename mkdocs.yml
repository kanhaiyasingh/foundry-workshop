site_name: "Microsoft Foundry Workshop for C#/.NET"
site_description: >-
  Build enterprise AI applications and agents on Microsoft Foundry with C# and .NET 10.
site_url: "https://malaika2820.github.io/foundry-workshop-c-/"

repo_name: "malaika2820/foundry-workshop-c-"
repo_url: "https://github.com/malaika2820/foundry-workshop-c-"
edit_uri: "edit/main/docs/"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Setup: setup.md
  - Python reference:
      - Setup and usage: python-reference.md
      - Original debug log: modules/debug.md
  - Concepts: concepts.md
  - Troubleshooting: troubleshooting.md
  - Platform:
      - "What is Foundry": platform/01-what-is-foundry.md
      - "Architecture & projects": platform/02-architecture-and-projects.md
      - "Control plane & governance": platform/03-control-plane-and-governance.md
      - "MCP tool servers": platform/04-mcp-tool-servers.md
  - Labs:
      - "M1 · First Inference": modules/01-first-inference.md
      - "M2 · Your First Agent": modules/02-your-first-agent.md
      - "M3 · Tools & Function Calling": modules/03-tools-and-function-calling.md
      - "M4 · Grounding / RAG": modules/04-grounding-rag.md
      - "M5 · MCP Tools": modules/05-mcp-tools.md
      - "M5b · Work IQ": modules/05b-work-iq.md
      - "M6 · Agent Memory": modules/06-agent-memory.md
      - "M7 · Multi-Agent Orchestration": modules/07-multi-agent-orchestration.md
      - "M8 · Deep Research": modules/08-deep-research.md
      - "M9 · Evaluation": modules/09-evaluation.md
      - "M10 · Observability": modules/10-observability.md
      - "M11 · Guardrails": modules/11-guardrails.md
      - "M12 · Red Teaming": modules/12-red-teaming.md
      - "M13 · HITL & REST": modules/13-human-in-loop-rest.md
      - "M14 · Fine-Tuning": modules/14-fine-tuning.md
      - "M15 · Capstone": modules/15-capstone.md
